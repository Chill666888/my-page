<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e27" />
<title>中秋佳节 · 花好月圆</title>
<style>
  /* ==================== 基础重置 ==================== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100%;
    background: #0a0e27;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    overflow-x: hidden;
  }

  button { font-family: inherit; }

  /* ==================== 页面容器 ==================== */
  .page {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 55% at 50% -5%, rgba(96, 74, 168, 0.55), transparent 70%),
      radial-gradient(ellipse 70% 45% at 85% 105%, rgba(74, 46, 120, 0.45), transparent 70%),
      linear-gradient(180deg, #0a0e27 0%, #121a3c 32%, #1b2352 62%, #241a3d 100%);
  }

  /* ==================== 星空画布 ==================== */
  .sky-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* ==================== 月亮 ==================== */
  .moon-wrap {
    position: absolute;
    top: 34px;
    left: 50%;
    margin-left: -52px;
    width: 104px;
    height: 104px;
    z-index: 2;
  }

  .halo-outer {
    position: absolute;
    top: 50%; left: 50%;
    width: 300px; height: 300px;
    margin: -150px 0 0 -150px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 240, 200, 0.20) 0%,
      rgba(255, 235, 190, 0.08) 42%,
      rgba(255, 230, 180, 0.02) 62%,
      transparent 75%);
    animation: breathe 6s ease-in-out infinite;
    pointer-events: none;
  }

  .halo-inner {
    position: absolute;
    top: 50%; left: 50%;
    width: 200px; height: 200px;
    margin: -100px 0 0 -100px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 248, 220, 0.34) 0%,
      rgba(255, 240, 195, 0.12) 50%,
      transparent 72%);
    animation: breathe 4.5s ease-in-out infinite reverse;
    pointer-events: none;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.65; transform: scale(0.92); }
    50%      { opacity: 1;    transform: scale(1.08); }
  }

  .moon {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 28%,
      #fffef9 0%, #fff8e2 36%, #f8e5b4 70%, #e9ce90 100%);
    box-shadow:
      0 0 20px rgba(255, 240, 195, 0.85),
      0 0 50px rgba(255, 224, 150, 0.45),
      inset -7px -7px 17px rgba(196, 158, 82, 0.35),
      inset 4px 4px 11px rgba(255, 255, 255, 0.55);
    animation: floatMoon 7s ease-in-out infinite;
  }

  @keyframes floatMoon {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .crater {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 34%,
      rgba(206, 174, 116, 0.34),
      rgba(196, 162, 104, 0.16) 70%,
      transparent 100%);
    box-shadow: inset 2px 2px 4px rgba(168, 134, 74, 0.28);
  }

  .c1 { width: 24px; height: 24px; top: 15px; left: 17px; }
  .c2 { width: 15px; height: 15px; top: 56px; left: 31px; }
  .c3 { width: 11px; height: 11px; top: 29px; left: 61px; }

  .rabbit {
    position: absolute;
    right: -12px; bottom: -8px;
    font-size: 28px;
    line-height: 1;
    filter: drop-shadow(0 0 8px rgba(255, 218, 140, 0.75));
    animation: hop 2.6s ease-in-out infinite;
    pointer-events: none;
    z-index: 3;
  }

  @keyframes hop {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-9px) rotate(4deg); }
  }

  /* ==================== 云朵 ==================== */
  .cloud {
    position: absolute;
    left: 100vw;
    border-radius: 50%;
    opacity: 0;
    filter: blur(6px);
    pointer-events: none;
    z-index: 2;
    background:
      radial-gradient(ellipse at 28% 62%, rgba(255,255,255,0.20) 0%, transparent 58%),
      radial-gradient(ellipse at 58% 38%, rgba(255,255,255,0.26) 0%, transparent 55%),
      radial-gradient(ellipse at 84% 66%, rgba(255,255,255,0.16) 0%, transparent 52%);
    animation-name: drift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform, opacity;
  }

  .cloud-a { top: 20vh; width: 210px; height: 75px; animation-duration: 46s; animation-delay: 0s; }
  .cloud-b { top: 41vh; width: 160px; height: 60px; animation-duration: 60s; animation-delay: 14s; }
  .cloud-c { top: 11vh; width: 260px; height: 90px; animation-duration: 72s; animation-delay: 30s; }

  @keyframes drift {
    0%   { transform: translateX(0); opacity: 0; }
    8%   { opacity: 0.9; }
    86%  { opacity: 0.9; }
    100% { transform: translateX(-145vw); opacity: 0; }
  }

  /* ==================== 灯笼 ==================== */
  .lantern {
    position: absolute;
    top: 9vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 5;
    cursor: pointer;
    transform-origin: 50% 0;
    animation: sway 4.5s ease-in-out infinite;
    user-select: none;
  }

  .lantern-left  { left: 20px; }
  .lantern-right { right: 20px; animation-delay: 1.2s; }

  @keyframes sway {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(6deg); }
  }

  .lantern-line {
    width: 2px; height: 36px;
    background: linear-gradient(180deg, rgba(255,215,120,0), rgba(255,215,120,0.7));
  }

  .lantern-body {
    position: relative;
    width: 38px; height: 46px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #ff9a76, #e63b3b 52%, #b01818 100%);
    box-shadow:
      0 0 17px rgba(255, 92, 72, 0.75),
      0 0 35px rgba(255, 80, 60, 0.35),
      inset -4px -4px 9px rgba(110, 0, 0, 0.45);
  }

  .lantern-body::before,
  .lantern-body::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 22px; height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, #a8760a, #ffd966 50%, #a8760a);
  }

  .lantern-body::before { top: -2px; }
  .lantern-body::after  { bottom: -2px; }

  .lantern-tassel {
    width: 2px; height: 20px;
    background: linear-gradient(180deg, #ffd966, rgba(255,217,102,0));
  }

  /* ==================== 主内容 ==================== */
  .content {
    position: relative;
    z-index: 10;
    padding: 208px 24px 190px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .date-pill {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    letter-spacing: 1.5px;
    color: rgba(255, 233, 184, 0.85);
    background: rgba(255, 220, 150, 0.08);
    border: 1px solid rgba(255, 220, 150, 0.22);
  }

  .title {
    margin-top: 14px;
    font-size: clamp(32px, 9.5vw, 46px);
    font-weight: 700;
    letter-spacing: 7px;
    text-indent: 7px;
    background: linear-gradient(180deg, #fffdf2 0%, #ffe08a 48%, #e0a83c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(255, 210, 110, 0.55));
  }

  .subtitle {
    margin-top: 10px;
    font-size: clamp(11px, 3.3vw, 14px);
    letter-spacing: 2px;
    color: rgba(255, 236, 200, 0.58);
  }

  /* 祝福卡片 */
  .wish-card {
    margin-top: 28px;
    width: 100%;
    max-width: 460px;
    padding: 24px 20px;
    border-radius: 18px;
    background: linear-gradient(160deg, rgba(255,255,255,0.11), rgba(255,255,255,0.035));
    border: 1px solid rgba(255, 230, 170, 0.22);
    box-shadow:
      0 10px 28px rgba(0, 0, 0, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: opacity 0.26s ease, transform 0.26s ease;
  }

  .wish-card.out {
    opacity: 0;
    transform: translateY(-8px) scale(0.95);
  }

  .wish-text {
    font-size: clamp(16px, 4.6vw, 20px);
    line-height: 1.85;
    letter-spacing: 1.5px;
    color: #fdf4e0;
    text-shadow: 0 0 10px rgba(255, 220, 150, 0.35);
  }

  /* 按钮组 */
  .actions {
    margin-top: 24px;
    width: 100%;
    max-width: 460px;
    display: flex;
    gap: 12px;
  }

  .btn {
    flex: 1;
    height: 46px;
    border: none;
    border-radius: 23px;
    font-size: 15px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.2s ease;
  }

  .btn:active {
    transform: scale(0.95);
    opacity: 0.88;
  }

  .btn-primary {
    font-weight: 600;
    color: #4a2c00;
    background: linear-gradient(135deg, #ffe08a 0%, #f5a623 55%, #e08b00 100%);
    box-shadow:
      0 8px 20px rgba(240, 165, 0, 0.38),
      inset 0 1px 0 rgba(255, 255, 255, 0.55);
  }

  .btn-share {
    color: #ffe9b8;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 230, 170, 0.30);
  }

  /* 工具条 */
  .toolbar {
    margin-top: 16px;
    width: 100%;
    max-width: 460px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .tool {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 10px 4px;
    border-radius: 14px;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: #ffe9b8;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 230, 170, 0.16);
    cursor: pointer;
    transition: transform 0.16s ease, background 0.2s ease, border-color 0.2s ease;
  }

  .tool span { font-size: 19px; line-height: 1; }

  .tool:active {
    transform: scale(0.93);
    background: rgba(255, 255, 255, 0.1);
  }

  .tool.off {
    opacity: 0.42;
  }

  .footnote {
    margin-top: 22px;
    font-size: 12px;
    letter-spacing: 1px;
    color: rgba(255, 236, 200, 0.4);
  }

  /* ==================== 月饼 ==================== */
  .mooncake-wrap {
    position: fixed;
    right: 20px;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }

  .mooncake {
    font-size: 56px;
    line-height: 1;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
    animation: bob 3.2s ease-in-out infinite;
    transition: transform 0.2s ease;
  }

  .mooncake-wrap:active .mooncake {
    transform: scale(1.28) rotate(10deg);
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }

  .mooncake-count {
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: rgba(255, 232, 180, 0.72);
    text-shadow: 0 0 6px rgba(255, 200, 100, 0.5);
    white-space: nowrap;
  }

  /* ==================== 飘字 ==================== */
  .float-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 120;
  }

  .float-text {
    position: fixed;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    color: #ffd966;
    text-shadow:
      0 0 8px rgba(255, 200, 80, 0.9),
      0 1px 4px rgba(0, 0, 0, 0.5);
    animation: floatUp 1.6s cubic-bezier(0.22, 0.68, 0.4, 1) forwards;
    will-change: transform, opacity;
  }

  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
    22%  { opacity: 1; transform: translate(-50%, -12px) scale(1.12); }
    100% { opacity: 0; transform: translate(-50%, -78px) scale(1); }
  }

  /* ==================== 孔明灯 ==================== */
  .lantern-sky {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 15;
    overflow: hidden;
  }

  .sky-lantern {
    position: absolute;
    bottom: -150px;
    width: 44px;
    margin-left: -22px;
    animation-name: riseUp;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    will-change: transform, opacity;
  }

  @keyframes riseUp {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translate(var(--dx, 0px), -118vh) rotate(var(--rot, 0deg)); opacity: 0; }
  }

  .sl-body {
    width: 44px;
    height: 56px;
    border-radius: 50% 50% 44% 44%;
    background: radial-gradient(circle at 40% 28%, #fff6d0, #ffb347 55%, #e8741a 100%);
    box-shadow:
      0 0 22px rgba(255, 180, 70, 0.85),
      0 0 48px rgba(255, 145, 35, 0.45);
    animation: flicker 1.6s ease-in-out infinite;
  }

  @keyframes flicker {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.2); }
  }

  .sl-text {
    margin-top: 5px;
    font-size: 10px;
    line-height: 1.2;
    text-align: center;
    color: #ffe9b8;
    text-shadow: 0 0 6px rgba(255, 200, 90, 0.9);
    white-space: nowrap;
  }

  /* ==================== 弹窗 ==================== */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(5, 7, 20, 0.75);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.28s ease, visibility 0.28s;
  }

  .modal.show {
    opacity: 1;
    visibility: visible;
  }

  .modal-card {
    width: 100%;
    max-width: 400px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 22px;
    border-radius: 22px;
    background: linear-gradient(160deg, #1f2755, #151a36);
    border: 1px solid rgba(255, 230, 170, 0.25);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
    transform: translateY(18px) scale(0.96);
    transition: transform 0.32s cubic-bezier(0.22, 0.68, 0.4, 1);
  }

  .modal.show .modal-card {
    transform: translateY(0) scale(1);
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #ffe08a;
  }

  .modal-close {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    color: #ffe9b8;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .modal-close:active { background: rgba(255, 255, 255, 0.18); }

  .riddle-q {
    font-size: 17px;
    line-height: 1.8;
    letter-spacing: 1px;
    color: #fdf4e0;
    text-align: center;
    padding: 8px 0 4px;
  }

  .riddle-answer {
    min-height: 34px;
    margin-top: 10px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 2px;
    text-align: center;
    color: #7dffb0;
    text-shadow: 0 0 12px rgba(90, 255, 160, 0.45);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .riddle-answer.show {
    opacity: 1;
    transform: translateY(0);
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .modal-actions .btn {
    height: 44px;
    font-size: 14px;
    border-radius: 22px;
  }

  .wish-input {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border-radius: 14px;
    font-size: 15px;
    color: #fdf4e0;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 230, 170, 0.24);
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .wish-input:focus {
    border-color: rgba(255, 210, 110, 0.7);
    background: rgba(255, 255, 255, 0.11);
  }

  .wish-input::placeholder {
    color: rgba(255, 236, 200, 0.35);
  }

  .card-preview {
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: #0a0e27;
    border: 1px solid rgba(255, 230, 170, 0.16);
  }

  .card-preview canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ==================== Toast ==================== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 100px;
    transform: translate(-50%, 14px);
    padding: 10px 20px;
    border-radius: 24px;
    background: rgba(20, 16, 40, 0.94);
    border: 1px solid rgba(255, 220, 150, 0.3);
    color: #ffe9b8;
    font-size: 13px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 300;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* ==================== 小屏适配 ==================== */
  @media (max-height: 700px) {
    .content { padding-top: 180px; padding-bottom: 160px; }
    .moon-wrap { top: 22px; }
    .lantern { top: 6vh; }
  }

  @media (min-width: 768px) {
    .content { padding-top: 240px; }
    .moon-wrap { top: 48px; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- 星空 / 花瓣 / 烟花 -->
  <canvas id="sky" class="sky-canvas"></canvas>

  <!-- 月亮 -->
  <div class="moon-wrap">
    <div class="halo-outer"></div>
    <div class="halo-inner"></div>
    <div class="moon">
      <div class="crater c1"></div>
      <div class="crater c2"></div>
      <div class="crater c3"></div>
    </div>
    <div class="rabbit">🐰</div>
  </div>

  <!-- 云朵 -->
  <div class="cloud cloud-a"></div>
  <div class="cloud cloud-b"></div>
  <div class="cloud cloud-c"></div>

  <!-- 灯笼 -->
  <div class="lantern lantern-left">
    <div class="lantern-line"></div>
    <div class="lantern-body"></div>
    <div class="lantern-tassel"></div>
  </div>
  <div class="lantern lantern-right">
    <div class="lantern-line"></div>
    <div class="lantern-body"></div>
    <div class="lantern-tassel"></div>
  </div>

  <!-- 孔明灯天空层 -->
  <div class="lantern-sky" id="lanternSky"></div>

  <!-- 主内容 -->
  <main class="content">
    <div class="date-pill" id="datePill">农历八月十五 · 中秋佳节</div>

    <h1 class="title">中秋佳节</h1>
    <p class="subtitle">花 好 月 圆 · 人 月 两 圆</p>

    <div class="wish-card" id="wishCard">
      <p class="wish-text" id="wishText">但愿人长久，千里共婵娟。</p>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="changeBtn" type="button">换一句祝福</button>
      <button class="btn btn-share" id="wishLanternBtn" type="button">放孔明灯</button>
    </div>

    <div class="toolbar">
      <button class="tool" id="riddleBtn" type="button"><span>🏮</span>猜灯谜</button>
      <button class="tool" id="fireworkBtn" type="button"><span>🎆</span>放烟花</button>
      <button class="tool" id="cardBtn" type="button"><span>🖼️</span>祝福卡</button>
      <button class="tool" id="soundBtn" type="button"><span>🔊</span>音效</button>
    </div>

    <p class="footnote">点击夜空即可绽放烟花 · 愿你今夜抬头即是圆满</p>
  </main>

  <!-- 月饼 -->
  <div class="mooncake-wrap" id="mooncakeWrap">
    <div class="mooncake">🥮</div>
    <div class="mooncake-count" id="mooncakeCount"></div>
  </div>

  <!-- 飘字层 -->
  <div class="float-layer" id="floatLayer"></div>

  <!-- 灯谜弹窗 -->
  <div class="modal" id="riddleModal">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title">🏮 中秋灯谜</span>
        <button class="modal-close" data-close type="button">✕</button>
      </div>
      <p class="riddle-q" id="riddleQ"></p>
      <div class="riddle-answer" id="riddleA"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="showAnswerBtn" type="button">看答案</button>
        <button class="btn btn-share" id="nextRiddleBtn" type="button">下一题</button>
      </div>
    </div>
  </div>

  <!-- 许愿弹窗 -->
  <div class="modal" id="wishModal">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title">🏮 写下你的中秋心愿</span>
        <button class="modal-close" data-close type="button">✕</button>
      </div>
      <input class="wish-input" id="wishInput" maxlength="14" placeholder="例如：愿家人平安健康" />
      <div class="modal-actions">
        <button class="btn btn-primary" id="releaseLanternBtn" type="button">放飞孔明灯</button>
      </div>
    </div>
  </div>

  <!-- 祝福卡弹窗 -->
  <div class="modal" id="cardModal">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title">🖼️ 中秋祝福卡</span>
        <button class="modal-close" data-close type="button">✕</button>
      </div>
      <div class="card-preview">
        <canvas id="cardCanvas" width="600" height="820"></canvas>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="downloadCardBtn" type="button">保存图片</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
   *  数据
   * ============================================================ */
  var WISHES = [
    '但愿人长久，千里共婵娟。',
    '海上生明月，天涯共此时。',
    '露从今夜白，月是故乡明。',
    '今夜月明人尽望，不知秋思落谁家。',
    '一轮秋影转金波，飞镜又重磨。',
    '桂花浮玉，正月满天街，夜凉如洗。',
    '月到中秋分外明，人到中秋情更浓。',
    '此夜中秋月，清光十万家。',
    '愿年年今夜，月华如练，长是人千里。',
    '忆对中秋丹桂丛，花也杯中，月也杯中。',
    '好时节，愿得年年，常见中秋月。',
    '阴晴圆缺都休说，且喜人间好时节。'
  ];

  var LANTERN_TEXTS = [
    '🏮 阖家团圆', '🏮 月圆人圆', '🏮 事事圆满',
    '🏮 平安喜乐', '🏮 心想事成', '🏮 岁岁欢愉'
  ];

  var RIDDLES = [
    { q: '中秋菊盛开（打一成语）', a: '花好月圆' },
    { q: '一轮明月照窗前（打一礼貌用语）', a: '光临舍下' },
    { q: '中秋佳节结良缘（打一城市名）', a: '重庆' },
    { q: '太阳西边下，月亮东边挂（打一字）', a: '明' },
    { q: '中秋月饼（打一电脑名词）', a: '软盘' },
    { q: '十五的月亮（打一成语）', a: '正大光明' },
    { q: '水中捞月（打一成语）', a: '白费心机' },
    { q: '中秋的月亮（打一成语）', a: '正大光明' }
  ];

  /* ============================================================
   *  工具
   * ============================================================ */
  function rand(min, max) { return Math.random() * (max - min) + min; }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var canVibrate = typeof navigator.vibrate === 'function';
  function vibrate(ms) {
    if (canVibrate) { try { navigator.vibrate(ms || 15); } catch (e) {} }
  }

  /* ============================================================
   *  音效（Web Audio 合成，无需外部资源）
   * ============================================================ */
  var Sound = (function () {
    var ac = null;
    var enabled = true;

    function ensure() {
      if (!ac) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try { ac = new AC(); } catch (e) { return null; }
      }
      if (ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
      return ac;
    }

    function tone(freq, dur, type, gain, delay) {
      if (!enabled) return;
      var ctx = ensure();
      if (!ctx) return;
      var t0 = ctx.currentTime + (delay || 0);
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(gain || 0.05, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.06);
    }

    return {
      ding: function () {
        tone(880, 0.36, 'sine', 0.05);
        tone(1320, 0.26, 'sine', 0.022, 0.02);
      },
      pop: function () {
        tone(520, 0.2, 'triangle', 0.05);
        tone(780, 0.14, 'sine', 0.025, 0.03);
      },
      boom: function () {
        tone(90, 0.5, 'sawtooth', 0.05);
        tone(160, 0.32, 'triangle', 0.03, 0.02);
      },
      chime: function () {
        [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
          tone(f, 0.55, 'sine', 0.035, i * 0.1);
        });
      },
      toggle: function () { enabled = !enabled; return enabled; },
      isOn: function () { return enabled; }
    };
  })();

  /* ============================================================
   *  Canvas 星空 / 花瓣 / 烟花
   * ============================================================ */
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var stars = [];
  var meteors = [];
  var petals = [];
  var sparks = [];

  var parallax = { x: 0, y: 0 };
  var targetParallax = { x: 0, y: 0 };

  function resizeCanvas() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* ---------- 星星 ---------- */
  function initStars() {
    stars = [];
    var count = Math.min(Math.round((W * H) / 8500), 200);
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.88,
        r: rand(0.4, 1.8),
        phase: Math.random() * Math.PI * 2,
        speed: rand(0.5, 2.0),
        depth: rand(0.15, 1)
      });
    }
  }

  function drawStars() {
    var t = performance.now() / 1000;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = 0.4 + 0.6 * Math.abs(Math.sin(t * s.speed + s.phase));
      var px = s.x + parallax.x * s.depth * 20;
      var py = s.y + parallax.y * s.depth * 20;

      ctx.globalAlpha = tw;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();

      if (s.r > 1.15) {
        ctx.globalAlpha = tw * 0.22;
        ctx.beginPath();
        ctx.arc(px, py, s.r * 3.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- 流星 ---------- */
  var meteorTimer = 1.2;

  function spawnMeteor() {
    meteors.push({
      x: rand(-60, W * 0.7),
      y: rand(-40, H * 0.32),
      vx: rand(320, 520),
      vy: rand(190, 320),
      life: 1,
      len: rand(80, 170),
      width: rand(1.2, 2.4)
    });
  }

  function updateMeteors(dt) {
    meteorTimer -= dt;
    if (meteorTimer <= 0) {
      meteorTimer = rand(3.5, 9);
      spawnMeteor();
    }

    for (var i = meteors.length - 1; i >= 0; i--) {
      var m = meteors[i];
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.life -= dt * 0.85;

      if (m.life <= 0 || m.x > W + 240 || m.y > H + 240) {
        meteors.splice(i, 1);
        continue;
      }

      var ang = Math.atan2(m.vy, m.vx);
      var tx = m.x - Math.cos(ang) * m.len;
      var ty = m.y - Math.sin(ang) * m.len;

      var grad = ctx.createLinearGradient(tx, ty, m.x, m.y);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(1, 'rgba(255,255,255,' + Math.max(m.life, 0).toFixed(2) + ')');

      ctx.strokeStyle = grad;
      ctx.lineWidth = m.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(m.x, m.y);
      ctx.stroke();
    }
  }

  /* ---------- 桂花花瓣 ---------- */
  function makePetal(anywhere) {
    return {
      x: rand(-60, W + 60),
      y: anywhere ? rand(-H, H) : rand(-60, -10),
      size: rand(2.6, 6.2),
      vy: rand(20, 52),
      sway: rand(14, 40),
      swaySpeed: rand(0.5, 1.4),
      phase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: rand(-1.8, 1.8),
      alpha: rand(0.3, 0.8),
      hue: rand(40, 54)
    };
  }

  function initPetals() {
    petals = [];
    var n = Math.min(Math.round(W / 34), 40);
    for (var i = 0; i < n; i++) petals.push(makePetal(true));
  }

  function drawPetals(dt) {
    var t = performance.now() / 1000;
    for (var i = 0; i < petals.length; i++) {
      var p = petals[i];
      p.y += p.vy * dt;
      p.rot += p.rotSpeed * dt;

      if (p.y > H + 40) {
        petals[i] = makePetal(false);
        continue;
      }

      var x = p.x + Math.sin(t * p.swaySpeed + p.phase) * p.sway;

      ctx.save();
      ctx.translate(x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = 'hsl(' + p.hue + ', 90%, 66%)';
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.52, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- 烟花 ---------- */
  var HUES = [45, 32, 350, 288, 195, 16, 55];

  function explode(x, y, hue) {
    if (sparks.length > 1400) sparks.splice(0, 400);

    var baseHue = (hue == null)
      ? HUES[Math.floor(Math.random() * HUES.length)] + rand(-12, 12)
      : hue;

    var count = 64 + Math.floor(Math.random() * 46);

    for (var i = 0; i < count; i++) {
      var a = (Math.PI * 2 * i) / count + rand(-0.12, 0.12);
      var sp = rand(60, 260);
      sparks.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: rand(0.5, 1.05),
        hue: baseHue + rand(-22, 22),
        size: rand(1.1, 2.9)
      });
    }

    // 中心闪白
    for (var k = 0; k < 12; k++) {
      var a2 = Math.random() * Math.PI * 2;
      var sp2 = rand(10, 90);
      sparks.push({
        x: x, y: y,
        vx: Math.cos(a2) * sp2,
        vy: Math.sin(a2) * sp2,
        life: 1,
        decay: rand(1.2, 1.8),
        hue: baseHue,
        size: rand(1.8, 3.4)
      });
    }
  }

  function drawSparks(dt) {
    if (!sparks.length) return;

    ctx.globalCompositeOperation = 'lighter';

    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];

      s.vx *= 0.982;
      s.vy = s.vy * 0.982 + 120 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.life -= s.decay * dt;

      if (s.life <= 0 || s.y > H + 80) {
        sparks.splice(i, 1);
        continue;
      }

      var l = Math.max(s.life, 0);
      ctx.globalAlpha = l;
      ctx.fillStyle = 'hsl(' + s.hue + ', 100%, ' + (58 + l * 22) + '%)';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * l, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 主循环 ---------- */
  var autoFireTimer = 5;
  var lastTime = performance.now();

  function loop(now) {
    var dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    // 平滑视差
    parallax.x += (targetParallax.x - parallax.x) * Math.min(dt * 4, 1);
    parallax.y += (targetParallax.y - parallax.y) * Math.min(dt * 4, 1);

    ctx.clearRect(0, 0, W, H);

    drawStars();
    updateMeteors(dt);
    drawPetals(dt);
    drawSparks(dt);

    // 自动烟花
    autoFireTimer -= dt;
    if (autoFireTimer <= 0) {
      autoFireTimer = rand(7, 14);
      if (document.visibilityState === 'visible') {
        explode(rand(W * 0.12, W * 0.88), rand(H * 0.1, H * 0.4));
      }
    }

    requestAnimationFrame(loop);
  }

  /* ============================================================
   *  飘字 & Toast
   * ============================================================ */
  var floatLayer = document.getElementById('floatLayer');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function addFloatText(x, y, text) {
    var el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    floatLayer.appendChild(el);
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 1700);
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 2000);
  }

  /* ============================================================
   *  换一句祝福
   * ============================================================ */
  var wishTextEl = document.getElementById('wishText');
  var wishCardEl = document.getElementById('wishCard');
  var changeBtn = document.getElementById('changeBtn');

  var wishIndex = Math.floor(Math.random() * WISHES.length);
  var animating = false;
  var wishTimer = null;

  wishTextEl.textContent = WISHES[wishIndex];

  changeBtn.addEventListener('click', function () {
    if (animating) return;
    animating = true;

    var next = wishIndex;
    while (next === wishIndex && WISHES.length > 1) {
      next = Math.floor(Math.random() * WISHES.length);
    }

    wishCardEl.classList.add('out');

    clearTimeout(wishTimer);
    wishTimer = setTimeout(function () {
      wishIndex = next;
      wishTextEl.textContent = WISHES[next];
      wishCardEl.classList.remove('out');
      animating = false;
    }, 260);

    Sound.ding();
    vibrate(15);
  });

  /* ============================================================
   *  点击月饼
   * ============================================================ */
  var mooncakeWrap = document.getElementById('mooncakeWrap');
  var countEl = document.getElementById('mooncakeCount');
  var mooncakeCount = 0;

  mooncakeWrap.addEventListener('click', function (e) {
    mooncakeCount++;
    countEl.textContent = '已送出 ' + mooncakeCount + ' 块';

    var x = e.clientX || (window.innerWidth - 60);
    var y = e.clientY || (window.innerHeight - 100);

    addFloatText(x, y - 26, '🥮 中秋快乐！');
    explode(x, y - 20, 42);
    Sound.pop();
    vibrate(15);
  });

  /* ============================================================
   *  点击灯笼
   * ============================================================ */
  Array.prototype.forEach.call(document.querySelectorAll('.lantern'), function (el) {
    el.addEventListener('click', function (e) {
      var text = LANTERN_TEXTS[Math.floor(Math.random() * LANTERN_TEXTS.length)];
      addFloatText(e.clientX, e.clientY, text);
      Sound.ding();
      vibrate(12);
    });
  });

  /* ============================================================
   *  点击夜空放烟花
   * ============================================================ */
  document.addEventListener('pointerdown', function (e) {
    var t = e.target;
    if (!(t instanceof Element)) return;
    if (t.closest('button, input, .lantern, .mooncake-wrap, .modal, .wish-card, .sky-lantern')) return;
    if (e.clientY < 44) return;

    explode(e.clientX, e.clientY);
    Sound.pop();
    vibrate(10);
  });

  /* ============================================================
   *  鼠标 / 触摸视差
   * ============================================================ */
  window.addEventListener('pointermove', function (e) {
    targetParallax.x = (e.clientX / W - 0.5) * 2;
    targetParallax.y = (e.clientY / H - 0.5) * 2;
  }, { passive: true });

  /* ============================================================
   *  弹窗通用逻辑
   * ============================================================ */
  function openModal(id) {
    var m = document.getElementById(id);
    if (m) m.classList.add('show');
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (btn) {
    btn.addEventListener('click', function () {
      var m = btn.closest('.modal');
      if (m) m.classList.remove('show');
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('.modal'), function (m) {
    m.addEventListener('click', function (e) {
      if (e.target === m) m.classList.remove('show');
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      Array.prototype.forEach.call(document.querySelectorAll('.modal.show'), function (m) {
        m.classList.remove('show');
      });
    }
  });

  /* ============================================================
   *  猜灯谜
   * ============================================================ */
  var riddleQ = document.getElementById('riddleQ');
  var riddleA = document.getElementById('riddleA');
  var currentRiddle = -1;

  function pickRiddle() {
    var idx = currentRiddle;
    while (idx === currentRiddle && RIDDLES.length > 1) {
      idx = Math.floor(Math.random() * RIDDLES.length);
    }
    currentRiddle = idx;
    riddleQ.textContent = RIDDLES[idx].q;
    riddleA.textContent = RIDDLES[idx].a;
    riddleA.classList.remove('show');
  }

  document.getElementById('riddleBtn').addEventListener('click', function () {
    pickRiddle();
    openModal('riddleModal');
    Sound.ding();
  });

  document.getElementById('showAnswerBtn').addEventListener('click', function () {
    riddleA.classList.add('show');
    Sound.chime();
    vibrate(12);
  });

  document.getElementById('nextRiddleBtn').addEventListener('click', function () {
    pickRiddle();
    Sound.pop();
  });

  /* ============================================================
   *  孔明灯
   * ============================================================ */
  var lanternSky = document.getElementById('lanternSky');
  var wishInput = document.getElementById('wishInput');

  document.getElementById('wishLanternBtn').addEventListener('click', function () {
    openModal('wishModal');
    setTimeout(function () { wishInput.focus(); }, 320);
  });

  function releaseLantern(text) {
    var el = document.createElement('div');
    el.className = 'sky-lantern';

    var leftVW = rand(12, 84);
    var dx = rand(-120, 120);
    var rot = rand(-24, 24);
    var dur = rand(11, 17);

    el.style.left = leftVW + 'vw';
    el.style.setProperty('--dx', dx.toFixed(0) + 'px');
    el.style.setProperty('--rot', rot.toFixed(0) + 'deg');
    el.style.animationDuration = dur.toFixed(1) + 's';

    el.innerHTML =
      '<div class="sl-body"></div>' +
      '<div class="sl-text">' + escapeHtml(text) + '</div>';

    lanternSky.appendChild(el);

    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, dur * 1000 + 600);
  }

  document.getElementById('releaseLanternBtn').addEventListener('click', function () {
    var val = (wishInput.value || '').trim() || '愿家人平安健康';
    releaseLantern(val);

    var modal = document.getElementById('wishModal');
    modal.classList.remove('show');

    wishInput.value = '';
    Sound.chime();
    vibrate([12, 40, 12]);
    showToast('心愿已随孔明灯升空 🌕');

    // 同屏最多同时放 3 盏
    releaseLantern(val);
    setTimeout(function () { releaseLantern(val); }, 700);
  });

  wishInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      document.getElementById('releaseLanternBtn').click();
    }
  });

  /* ============================================================
   *  祝福卡生成
   * ============================================================ */
  var cardCanvas = document.getElementById('cardCanvas');
  var cardCtx = cardCanvas.getContext('2d');

  function wrapText(g, text, cx, y, maxWidth, lineHeight) {
    var chars = text.split('');
    var line = '';
    var lines = [];

    for (var i = 0; i < chars.length; i++) {
      var test = line + chars[i];
      if (g.measureText(test).width > maxWidth && line !== '') {
        lines.push(line);
        line = chars[i];
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);

    var startY = y - ((lines.length - 1) * lineHeight) / 2;
    for (var j = 0; j < lines.length; j++) {
      g.fillText(lines[j], cx, startY + j * lineHeight);
    }
  }

  function renderCard() {
    var w = cardCanvas.width;
    var h = cardCanvas.height;
    var g = cardCtx;

    g.clearRect(0, 0, w, h);

    /* 背景 */
    var bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#0a0e27');
    bg.addColorStop(0.45, '#161e46');
    bg.addColorStop(0.78, '#1e2555');
    bg.addColorStop(1, '#241a3d');
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);

    /* 星星 */
    for (var i = 0; i < 150; i++) {
      g.globalAlpha = rand(0.15, 0.95);
      g.fillStyle = '#ffffff';
      g.beginPath();
      g.arc(rand(0, w), rand(0, h * 0.72), rand(0.4, 1.8), 0, Math.PI * 2);
      g.fill();
    }
    g.globalAlpha = 1;

    /* 光晕 */
    var mx = w / 2;
    var my = 250;
    var halo = g.createRadialGradient(mx, my, 30, mx, my, 250);
    halo.addColorStop(0, 'rgba(255, 240, 190, 0.55)');
    halo.addColorStop(0.4, 'rgba(255, 225, 150, 0.16)');
    halo.addColorStop(1, 'rgba(255, 220, 140, 0)');
    g.fillStyle = halo;
    g.fillRect(0, 0, w, 620);

    /* 月亮 */
    var moonGrad = g.createRadialGradient(mx - 30, my - 34, 8, mx, my, 108);
    moonGrad.addColorStop(0, '#fffef9');
    moonGrad.addColorStop(0.38, '#fff7e0');
    moonGrad.addColorStop(0.75, '#f7e5b6');
    moonGrad.addColorStop(1, '#e5c88a');
    g.fillStyle = moonGrad;
    g.beginPath();
    g.arc(mx, my, 108, 0, Math.PI * 2);
    g.fill();

    /* 环形山 */
    var craters = [
      { x: -32, y: -36, r: 22 },
      { x: 26, y: 18, r: 15 },
      { x: -6, y: 46, r: 11 },
      { x: 44, y: -30, r: 9 }
    ];
    for (var c = 0; c < craters.length; c++) {
      var cr = craters[c];
      var cg = g.createRadialGradient(
        mx + cr.x - cr.r * 0.3, my + cr.y - cr.r * 0.3, cr.r * 0.15,
        mx + cr.x, my + cr.y, cr.r
      );
      cg.addColorStop(0, 'rgba(206, 174, 116, 0.34)');
      cg.addColorStop(1, 'rgba(196, 162, 104, 0.10)');
      g.fillStyle = cg;
      g.beginPath();
      g.arc(mx + cr.x, my + cr.y, cr.r, 0, Math.PI * 2);
      g.fill();
    }

    /* 桂花飘落 */
    for (var p = 0; p < 34; p++) {
      g.save();
      g.translate(rand(0, w), rand(0, h));
      g.rotate(rand(0, Math.PI * 2));
      g.globalAlpha = rand(0.15, 0.5);
      g.fillStyle = 'hsl(' + rand(40, 54) + ', 90%, 68%)';
      g.beginPath();
      g.ellipse(0, 0, rand(2.5, 5.5), rand(1.4, 3), 0, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }
    g.globalAlpha = 1;

    /* 标题 */
    g.textAlign = 'center';
    g.textBaseline = 'middle';

    g.font = 'bold 62px "PingFang SC", "Microsoft YaHei", sans-serif';
    g.fillStyle = '#ffe08a';
    g.shadowColor = 'rgba(255, 200, 90, 0.6)';
    g.shadowBlur = 26;
    g.fillText('中 秋 佳 节', w / 2, 480);
    g.shadowBlur = 0;

    /* 装饰线 */
    var lineY = 528;
    var lineW = 180;
    var lg = g.createLinearGradient(w / 2 - lineW, 0, w / 2 + lineW, 0);
    lg.addColorStop(0, 'rgba(255, 220, 150, 0)');
    lg.addColorStop(0.5, 'rgba(255, 220, 150, 0.75)');
    lg.addColorStop(1, 'rgba(255, 220, 150, 0)');
    g.strokeStyle = lg;
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(w / 2 - lineW, lineY);
    g.lineTo(w / 2 + lineW, lineY);
    g.stroke();

    /* 小圆点 */
    g.fillStyle = 'rgba(255, 220, 150, 0.9)';
    g.beginPath();
    g.arc(w / 2, lineY, 4, 0, Math.PI * 2);
    g.fill();

    /* 祝福语 */
    g.font = '32px "PingFang SC", "Microsoft YaHei", sans-serif';
    g.fillStyle = '#fdf4e0';
    g.shadowColor = 'rgba(255, 220, 150, 0.35)';
    g.shadowBlur = 16;
    wrapText(g, WISHES[wishIndex], w / 2, 615, w - 130, 50);
    g.shadowBlur = 0;

    /* 底部信息 */
    var now = new Date();
    var dateStr =
      now.getFullYear() + '.' + (now.getMonth() + 1) + '.' + now.getDate() +
      '  农历八月十五';

    g.font = '22px "PingFang SC", "Microsoft YaHei", sans-serif';
    g.fillStyle = 'rgba(255, 233, 184, 0.65)';
    g.fillText(dateStr, w / 2, h - 96);

    g.font = '20px "PingFang SC", "Microsoft YaHei", sans-serif';
    g.fillStyle = 'rgba(255, 233, 184, 0.42)';
    g.fillText('花 好 月 圆 · 人 月 两 圆', w / 2, h - 56);

    /* 边框 */
    g.strokeStyle = 'rgba(255, 220, 150, 0.22)';
    g.lineWidth = 2;
    g.strokeRect(18, 18, w - 36, h - 36);

    g.textAlign = 'start';
    g.textBaseline = 'alphabetic';
  }

  document.getElementById('cardBtn').addEventListener('click', function () {
    renderCard();
    openModal('cardModal');
    Sound.ding();
  });

  document.getElementById('downloadCardBtn').addEventListener('click', function () {
    try {
      var url = cardCanvas.toDataURL('image/png');
      var a = document.createElement('a');
      a.href = url;
      a.download = '中秋祝福卡.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      showToast('祝福卡已保存 🖼️');
      Sound.chime();
      vibrate(12);
    } catch (err) {
      showToast('保存失败，请长按图片保存');
    }
  });

  /* ============================================================
   *  音效开关
   * ============================================================ */
  var soundBtn = document.getElementById('soundBtn');

  soundBtn.addEventListener('click', function () {
    var on = Sound.toggle();
    soundBtn.classList.toggle('off', !on);
    soundBtn.innerHTML = '<span>' + (on ? '🔊' : '🔇') + '</span>' + (on ? '音效' : '静音');
    if (on) Sound.ding();
  });

  /* ============================================================
   *  日期
   * ============================================================ */
  (function () {
    var now = new Date();
    document.getElementById('datePill').textContent =
      (now.getMonth() + 1) + '月' + now.getDate() + '日 · 农历八月十五';
  })();

  /* ============================================================
   *  窗口尺寸变化
   * ============================================================ */
  var resizeTimer = null;
  var lastWidth = window.innerWidth;

  function handleResize() {
    resizeCanvas();
    if (Math.abs(window.innerWidth - lastWidth) > 40) {
      lastWidth = window.innerWidth;
      initStars();
      initPetals();
    }
  }

  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(handleResize, 180);
  });

  window.addEventListener('orientationchange', function () {
    setTimeout(handleResize, 260);
  });

  /* ============================================================
   *  初始化
   * ============================================================ */
  resizeCanvas();
  initStars();
  initPetals();
  requestAnimationFrame(loop);

  // 开场：几秒后放一组烟花，制造惊喜感
  setTimeout(function () {
    explode(W * 0.28, H * 0.26, 45);
    Sound.boom();
  }, 1200);

  setTimeout(function () {
    explode(W * 0.72, H * 0.20, 350);
  }, 1900);

  setTimeout(function () {
    explode(W * 0.5, H * 0.30, 288);
  }, 2600);

})();
</script>
</body>
</html>
