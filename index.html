<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e27" />
<title>中秋佳节 · 花好月圆</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%; min-height: 100%;
    background: #0a0e27;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body { overflow-x: hidden; }
  button { font-family: inherit; }

  .page {
    position: relative;
    width: 100%; min-height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 55% at 50% -5%, rgba(96, 74, 168, 0.55), transparent 70%),
      radial-gradient(ellipse 70% 45% at 85% 105%, rgba(74, 46, 120, 0.45), transparent 70%),
      linear-gradient(180deg, #0a0e27 0%, #121a3c 32%, #1b2352 62%, #241a3d 100%);
  }

  .sky-canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }

  /* ==================== 月亮 ==================== */
  .moon-wrap {
    position: absolute; top: 34px; left: 50%;
    margin-left: -52px; width: 104px; height: 104px;
    z-index: 12;
    pointer-events: auto;
  }

  .halo-outer {
    position: absolute; top: 50%; left: 50%;
    width: 300px; height: 300px;
    margin: -150px 0 0 -150px; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 240, 200, 0.20) 0%,
      rgba(255, 235, 190, 0.08) 42%,
      rgba(255, 230, 180, 0.02) 62%,
      transparent 75%);
    animation: breathe 6s ease-in-out infinite;
    pointer-events: none;
  }

  .halo-inner {
    position: absolute; top: 50%; left: 50%;
    width: 200px; height: 200px;
    margin: -100px 0 0 -100px; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 248, 220, 0.34) 0%,
      rgba(255, 240, 195, 0.12) 50%,
      transparent 72%);
    animation: breathe 4.5s ease-in-out infinite reverse;
    pointer-events: none;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.65; transform: scale(0.92); }
    50%      { opacity: 1;    transform: scale(1.08); }
  }

  .moon {
    position: relative; width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 28%,
      #fffef9 0%, #fff8e2 36%, #f8e5b4 70%, #e9ce90 100%);
    box-shadow:
      0 0 20px rgba(255, 240, 195, 0.85),
      0 0 50px rgba(255, 224, 150, 0.45),
      inset -7px -7px 17px rgba(196, 158, 82, 0.35),
      inset 4px 4px 11px rgba(255, 255, 255, 0.55);
    animation: floatMoon 7s ease-in-out infinite;
    cursor: pointer;
  }

  .moon:active { transform: scale(0.96); }

  @keyframes floatMoon {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .crater {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%,
      rgba(206, 174, 116, 0.34),
      rgba(196, 162, 104, 0.16) 70%,
      transparent 100%);
    box-shadow: inset 2px 2px 4px rgba(168, 134, 74, 0.28);
  }

  .c1 { width: 24px; height: 24px; top: 15px; left: 17px; }
  .c2 { width: 15px; height: 15px; top: 56px; left: 31px; }
  .c3 { width: 11px; height: 11px; top: 29px; left: 61px; }

  /* ==================== 玉兔 ==================== */
  .rabbit {
    position: absolute;
    right: -52px;
    bottom: -34px;
    width: 100px;
    height: 128px;
    z-index: 14;
    cursor: pointer;
    transform-origin: 50% 100%;
    animation: rabbitIdle 2.6s ease-in-out infinite;
    will-change: transform;
    pointer-events: auto;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.22));
  }

  @keyframes rabbitIdle {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    50%      { transform: translateY(-2.5px) scale(1.01, 0.99); }
  }

  .rabbit-ear {
    position: absolute;
    width: 20px; height: 50px;
    bottom: 76px;
    border-radius: 50% 50% 46% 46%;
    background: #fffdf8;
    border: 3px solid #3d2b56;
    transform-origin: 50% 100%;
    z-index: 1;
    overflow: hidden;
  }

  .rabbit-ear::after {
    content: '';
    position: absolute; left: 50%; top: 6px;
    transform: translateX(-50%);
    width: 8px; height: 30px;
    border-radius: 50%;
    background: #ffb0d3;
  }

  .rabbit-ear-left  { left: 22px; animation: earSwayLeft 3s ease-in-out infinite; }
  .rabbit-ear-right { left: 58px; animation: earSwayRight 3.4s ease-in-out infinite; }

  @keyframes earSwayLeft {
    0%, 100% { transform: rotate(-16deg); }
    50%      { transform: rotate(-8deg); }
  }

  @keyframes earSwayRight {
    0%, 100% { transform: rotate(16deg); }
    50%      { transform: rotate(8deg); }
  }

  .rabbit-tail {
    position: absolute;
    left: 78px; bottom: 8px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fffdf8;
    border: 3px solid #3d2b56;
    z-index: 1;
    animation: tailWag 1.6s ease-in-out infinite;
  }

  @keyframes tailWag {
    0%, 100% { transform: scale(1) translateX(0); }
    50%      { transform: scale(1.1) translateX(2px); }
  }

  .rabbit-body {
    position: absolute;
    left: 12px; bottom: 0;
    width: 74px; height: 62px;
    border-radius: 50% 50% 46% 46%;
    background: #fffdf8;
    border: 3px solid #3d2b56;
    z-index: 2;
  }

  .rabbit-belly {
    position: absolute;
    left: 50%; bottom: 8px;
    transform: translateX(-50%);
    width: 40px; height: 32px;
    border-radius: 50%;
    background: #ffe9f3;
    opacity: 0.9;
  }

  .rabbit-paw {
    position: absolute;
    bottom: 4px;
    width: 16px; height: 12px;
    border-radius: 50%;
    background: #fffdf8;
    border: 2.5px solid #3d2b56;
  }

  .rabbit-paw-left  { left: 18px; }
  .rabbit-paw-right { left: 42px; }

  .rabbit-head {
    position: absolute;
    left: 20px; bottom: 40px;
    width: 60px; height: 54px;
    border-radius: 50% 50% 46% 46%;
    background: #fffdf8;
    border: 3px solid #3d2b56;
    z-index: 3;
  }

  .rabbit-eye {
    position: absolute;
    width: 11px; height: 12px;
    top: 17px;
    border-radius: 50%;
    background: #2e2035;
    animation: eyeBlink 4.2s ease-in-out infinite;
  }

  .rabbit-eye-left  { left: 12px; }
  .rabbit-eye-right { left: 35px; }

  .rabbit-eye .eye-shine {
    position: absolute;
    left: 2px; top: 2px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #ffffff;
  }

  .rabbit-eye .eye-shine::after {
    content: '';
    position: absolute;
    left: 5px; top: 5px;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.75);
  }

  @keyframes eyeBlink {
    0%, 91%, 100% { transform: scaleY(1); }
    94%           { transform: scaleY(0.1); }
  }

  .rabbit-nose {
    position: absolute;
    left: 50%; top: 31px;
    margin-left: -3.5px;
    width: 7px; height: 5.5px;
    border-radius: 50% 50% 60% 60%;
    background: #ff7aa8;
  }

  .rabbit-mouth {
    position: absolute;
    left: 50%; top: 37px;
    margin-left: -6px;
    width: 12px; height: 6px;
    border-bottom: 2px solid #3d2b56;
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
  }

  .rabbit-blush {
    position: absolute;
    width: 12px; height: 7px;
    top: 27px;
    border-radius: 50%;
    background: #ffb0d3;
    opacity: 0.85;
    animation: blushPulse 2.8s ease-in-out infinite;
  }

  .rabbit-blush-left  { left: 3px; }
  .rabbit-blush-right { left: 44px; }

  @keyframes blushPulse {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.08); }
  }

  .rabbit.jump { animation: rabbitJump 0.95s cubic-bezier(0.28, 0.85, 0.4, 1); }

  @keyframes rabbitJump {
    0%   { transform: translateY(0) scale(1, 1); }
    8%   { transform: translateY(0) scale(1.12, 0.86); }
    18%  { transform: translateY(-40px) scale(0.92, 1.12); }
    32%  { transform: translateY(-62px) scale(1, 1); }
    46%  { transform: translateY(-64px) scale(1, 1); }
    60%  { transform: translateY(-16px) scale(1, 1); }
    72%  { transform: translateY(0) scale(1.16, 0.84); }
    82%  { transform: translateY(-5px) scale(0.97, 1.04); }
    90%  { transform: translateY(0) scale(1.05, 0.96); }
    100% { transform: translateY(0) scale(1, 1); }
  }

  .rabbit.jump .rabbit-ear-left  { animation: earJumpLeft 0.95s cubic-bezier(0.28, 0.85, 0.4, 1); }
  .rabbit.jump .rabbit-ear-right { animation: earJumpRight 0.95s cubic-bezier(0.28, 0.85, 0.4, 1); }

  @keyframes earJumpLeft {
    0%   { transform: rotate(-16deg); }
    22%  { transform: rotate(-42deg); }
    50%  { transform: rotate(-4deg); }
    72%  { transform: rotate(-24deg); }
    88%  { transform: rotate(-10deg); }
    100% { transform: rotate(-16deg); }
  }

  @keyframes earJumpRight {
    0%   { transform: rotate(16deg); }
    22%  { transform: rotate(42deg); }
    50%  { transform: rotate(4deg); }
    72%  { transform: rotate(24deg); }
    88%  { transform: rotate(10deg); }
    100% { transform: rotate(16deg); }
  }

  .rabbit-heart {
    position: fixed;
    font-size: 18px;
    pointer-events: none;
    z-index: 130;
    animation: heartFloat 1.4s cubic-bezier(0.22, 0.68, 0.4, 1) forwards;
    will-change: transform, opacity;
  }

  @keyframes heartFloat {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.4) rotate(-10deg); }
    25%  { opacity: 1; transform: translate(-50%, -16px) scale(1.12) rotate(6deg); }
    60%  { opacity: 0.9; transform: translate(-50%, -44px) scale(1) rotate(-6deg); }
    100% { opacity: 0; transform: translate(-50%, -78px) scale(0.85) rotate(10deg); }
  }

  /* ==================== 云朵 ==================== */
  .cloud {
    position: absolute; left: 100vw;
    border-radius: 50%; opacity: 0;
    filter: blur(6px);
    pointer-events: none; z-index: 2;
    background:
      radial-gradient(ellipse at 28% 62%, rgba(255,255,255,0.20) 0%, transparent 58%),
      radial-gradient(ellipse at 58% 38%, rgba(255,255,255,0.26) 0%, transparent 55%),
      radial-gradient(ellipse at 84% 66%, rgba(255,255,255,0.16) 0%, transparent 52%);
    animation-name: drift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform, opacity;
  }

  .cloud-a { top: 20vh; width: 210px; height: 75px; animation-duration: 46s; animation-delay: 0s; }
  .cloud-b { top: 41vh; width: 160px; height: 60px; animation-duration: 60s; animation-delay: 14s; }
  .cloud-c { top: 11vh; width: 260px; height: 90px; animation-duration: 72s; animation-delay: 30s; }

  @keyframes drift {
    0%   { transform: translateX(0); opacity: 0; }
    8%   { opacity: 0.9; }
    86%  { opacity: 0.9; }
    100% { transform: translateX(-145vw); opacity: 0; }
  }

  /* ==================== 灯笼 ==================== */
  .lantern {
    position: absolute; top: 9vh;
    display: flex; flex-direction: column; align-items: center;
    z-index: 5; cursor: pointer;
    transform-origin: 50% 0;
    animation: sway 4.5s ease-in-out infinite;
    user-select: none;
  }

  .lantern-left  { left: 20px; }
  .lantern-right { right: 20px; animation-delay: 1.2s; }

  @keyframes sway {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(6deg); }
  }

  .lantern-line {
    width: 2px; height: 36px;
    background: linear-gradient(180deg, rgba(255,215,120,0), rgba(255,215,120,0.7));
  }

  .lantern-body {
    position: relative; width: 38px; height: 46px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #ff9a76, #e63b3b 52%, #b01818 100%);
    box-shadow:
      0 0 17px rgba(255, 92, 72, 0.75),
      0 0 35px rgba(255, 80, 60, 0.35),
      inset -4px -4px 9px rgba(110, 0, 0, 0.45);
  }

  .lantern-body::before, .lantern-body::after {
    content: ''; position: absolute; left: 50%;
    transform: translateX(-50%);
    width: 22px; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, #a8760a, #ffd966 50%, #a8760a);
  }

  .lantern-body::before { top: -2px; }
  .lantern-body::after  { bottom: -2px; }

  .lantern-tassel {
    width: 2px; height: 20px;
    background: linear-gradient(180deg, #ffd966, rgba(255,217,102,0));
  }

  /* ==================== 主内容 ==================== */
  .content {
    position: relative; z-index: 10;
    padding: 208px 24px 240px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    pointer-events: none;
  }

  .content .btn,
  .content .tool {
    pointer-events: auto;
  }

  .date-pill {
    padding: 6px 16px; border-radius: 20px;
    font-size: 12px; letter-spacing: 1.5px;
    color: rgba(255, 233, 184, 0.85);
    background: rgba(255, 220, 150, 0.08);
    border: 1px solid rgba(255, 220, 150, 0.22);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .title {
    margin-top: 14px;
    font-size: clamp(32px, 9.5vw, 46px);
    font-weight: 700; letter-spacing: 7px; text-indent: 7px;
    background: linear-gradient(180deg, #fffdf2 0%, #ffe08a 48%, #e0a83c 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(255, 210, 110, 0.55));
  }

  .subtitle {
    margin-top: 10px;
    font-size: clamp(11px, 3.3vw, 14px);
    letter-spacing: 2px;
    color: rgba(255, 236, 200, 0.58);
  }

  .wish-card {
    margin-top: 26px; width: 100%; max-width: 460px;
    padding: 22px 20px; border-radius: 18px;
    background: linear-gradient(160deg, rgba(255,255,255,0.11), rgba(255,255,255,0.035));
    border: 1px solid rgba(255, 230, 170, 0.22);
    box-shadow:
      0 10px 28px rgba(0, 0, 0, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: opacity 0.26s ease, transform 0.26s ease;
  }

  .wish-card.out {
    opacity: 0; transform: translateY(-8px) scale(0.95);
  }

  .wish-text {
    font-size: clamp(16px, 4.6vw, 20px);
    line-height: 1.85; letter-spacing: 1.5px;
    color: #fdf4e0;
    text-shadow: 0 0 10px rgba(255, 220, 150, 0.35);
  }

  .actions {
    margin-top: 22px; width: 100%; max-width: 460px;
    display: flex; gap: 12px;
  }

  .btn {
    flex: 1; height: 46px;
    border: none; border-radius: 23px;
    font-size: 15px; letter-spacing: 1px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.2s ease;
  }

  .btn:active { transform: scale(0.95); opacity: 0.88; }

  .btn-primary {
    font-weight: 600; color: #4a2c00;
    background: linear-gradient(135deg, #ffe08a 0%, #f5a623 55%, #e08b00 100%);
    box-shadow:
      0 8px 20px rgba(240, 165, 0, 0.38),
      inset 0 1px 0 rgba(255, 255, 255, 0.55);
  }

  .btn-share {
    color: #ffe9b8;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 230, 170, 0.30);
  }

  .toolbar {
    margin-top: 14px; width: 100%; max-width: 460px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }

  .tool {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 9px 2px; border-radius: 13px;
    font-size: 10.5px; letter-spacing: 0.4px;
    color: #ffe9b8;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 230, 170, 0.16);
    cursor: pointer;
    transition: transform 0.16s ease, background 0.2s ease, border-color 0.2s ease;
  }

  .tool span { font-size: 18px; line-height: 1; }

  .tool:active {
    transform: scale(0.93);
    background: rgba(255, 255, 255, 0.1);
  }

  .tool.off { opacity: 0.42; }

  .tool.active {
    background: rgba(255, 210, 110, 0.16);
    border-color: rgba(255, 210, 110, 0.55);
  }

  .footnote {
    margin-top: 18px;
    font-size: 11.5px; letter-spacing: 0.5px;
    color: rgba(255, 236, 200, 0.4);
    line-height: 1.7;
  }

  /* ==================== 烟花连发提示 ==================== */
  .burst-banner {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 16px;
    letter-spacing: 3px;
    font-weight: 700;
    color: #4a2c00;
    background: linear-gradient(135deg, #ffe08a 0%, #f5a623 55%, #e08b00 100%);
    box-shadow:
      0 12px 40px rgba(240, 165, 0, 0.6),
      inset 0 2px 0 rgba(255, 255, 255, 0.6);
    opacity: 0;
    pointer-events: none;
    z-index: 180;
    white-space: nowrap;
    transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.22, 0.68, 0.4, 1);
  }

  .burst-banner.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* ==================== 月饼 ==================== */
  .mooncake-wrap {
    position: fixed; right: 20px;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer; user-select: none;
    transition: transform 0.2s ease;
  }

  .mooncake-wrap:active { transform: scale(0.94); }

  .mooncake {
    font-size: 56px; line-height: 1;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
    animation: bob 3.2s ease-in-out infinite;
    transition: transform 0.2s ease;
  }

  .mooncake-wrap:active .mooncake {
    transform: scale(1.28) rotate(10deg);
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }

  .mooncake-count {
    margin-top: 4px; font-size: 11px; letter-spacing: 0.5px;
    color: rgba(255, 232, 180, 0.72);
    text-shadow: 0 0 6px rgba(255, 200, 100, 0.5);
    white-space: nowrap;
  }

  /* ==================== 飘字 ==================== */
  .float-layer {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 120;
  }

  .float-text {
    position: fixed; font-size: 15px; font-weight: 600;
    white-space: nowrap; color: #ffd966;
    text-shadow:
      0 0 8px rgba(255, 200, 80, 0.9),
      0 1px 4px rgba(0, 0, 0, 0.5);
    animation: floatUp 1.6s cubic-bezier(0.22, 0.68, 0.4, 1) forwards;
    will-change: transform, opacity;
  }

  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
    22%  { opacity: 1; transform: translate(-50%, -12px) scale(1.12); }
    100% { opacity: 0; transform: translate(-50%, -78px) scale(1); }
  }

  /* ==================== 孔明灯 ==================== */
  .lantern-sky {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 15; overflow: hidden;
  }

  .sky-lantern {
    position: absolute; bottom: -150px;
    width: 44px; margin-left: -22px;
    animation-name: riseUp;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    will-change: transform, opacity;
  }

  @keyframes riseUp {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translate(var(--dx, 0px), -118vh) rotate(var(--rot, 0deg)); opacity: 0; }
  }

  .sl-body {
    width: 44px; height: 56px;
    border-radius: 50% 50% 44% 44%;
    background: radial-gradient(circle at 40% 28%, #fff6d0, #ffb347 55%, #e8741a 100%);
    box-shadow:
      0 0 22px rgba(255, 180, 70, 0.85),
      0 0 48px rgba(255, 145, 35, 0.45);
    animation: flicker 1.6s ease-in-out infinite;
  }

  @keyframes flicker {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.2); }
  }

  .sl-text {
    margin-top: 5px; font-size: 10px; line-height: 1.2;
    text-align: center; color: #ffe9b8;
    text-shadow: 0 0 6px rgba(255, 200, 90, 0.9);
    white-space: nowrap;
  }

  /* ==================== 弹窗 ==================== */
  .modal {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 22px;
    background: rgba(5, 7, 20, 0.75);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    opacity: 0; visibility: hidden;
    transition: opacity 0.28s ease, visibility 0.28s;
  }

  .modal.show { opacity: 1; visibility: visible; }

  .modal-card {
    width: 100%; max-width: 400px;

    function tone(freq, dur, type, gain, delay) {
      if (!enabled) return;
      var ctx = ensure();
      if (!ctx) return;
      var t0 = ctx.currentTime + (delay || 0);
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);

      g.gain.linearRampToValueAtTime(gain || 0.05, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.06);
    }

    return {
      ding:  function () { tone(880, 0.36, 'sine', 0.05); tone(1320, 0.26, 'sine', 0.022, 0.02); },

      jump:  function () { tone(660, 0.14, 'sine', 0.038); tone(990, 0.16, 'sine', 0.028, 0.08); tone(1320, 0.1, 'sine', 0.018, 0.16); },

  /* ============================================================

  var Music = (function () {
    var ac = null;
    var master = null;
    var delayNode = null;
    var feedback = null;
    var enabled = false;
    var playing = false;
    var timerId = null;
    var step = 0;

    var SCALE = [
      293.66, 329.63, 392.00, 440.00, 493.88,
      587.33, 659.25, 783.99, 880.00, 987.88,
      1174.66, 1318.51
    ];
    var BASS = [73.42, 82.41, 98.00, 110.00, 123.47];

    function ensure() {
      if (ac) return ac;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ac = new AC(); } catch (e) { return null; }

      master = ac.createGain();
      master.gain.value = 0;

      delayNode = ac.createDelay(1.5);
      delayNode.delayTime.value = 0.42;
      feedback = ac.createGain();
      feedback.gain.value = 0.28;

      delayNode.connect(feedback);
      feedback.connect(delayNode);
      feedback.connect(master);

      master.connect(ac.destination);
      return ac;
    }

    function note(freq, dur, gain, delay, type) {
      if (!ac || !master) return;
      var t0 = ac.currentTime + (delay || 0);
      var osc = ac.createOscillator();
      var g = ac.createGain();

      osc.type = type || 'triangle';
      osc.frequency.setValueAtTime(freq, t0);

      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + 0.018);
      g.gain.exponentialRampToValueAtTime(gain * 0.35, t0 + dur * 0.35);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      osc.connect(g);
      g.connect(master);
      g.connect(delayNode);
      osc.start(t0);
      osc.stop(t0 + dur + 0.1);
    }

    function bassNote(freq, dur, gain, delay) {
      if (!ac || !master) return;
      var t0 = ac.currentTime + (delay || 0);
      var osc = ac.createOscillator();
      var g = ac.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t0);

      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + 0.4);
      g.gain.exponentialRampToValueAtTime(gain * 0.5, t0 + dur * 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + dur + 0.1);
    }

    function tick() {
      if (!playing) return;

      if (Math.random() < 0.82) {
        var idx = Math.floor(Math.random() * SCALE.length);
        if (idx > 8 && Math.random() < 0.6) idx = Math.floor(Math.random() * 6);

        var freq = SCALE[idx];
        var dur = 1.4 + Math.random() * 1.6;
        var gain = 0.022 + Math.random() * 0.018;
        note(freq, dur, gain, 0);

        if (Math.random() < 0.22) {
          note(freq * 2, 1.4, gain * 0.4, 0.08, 'sine');
        }
      }

      if (step % 6 === 0) {
        var bi = Math.floor(Math.random() * BASS.length);
        bassNote(BASS[bi], 7.5, 0.018, 0);
      }

      step++;
      timerId = setTimeout(tick, 850 + Math.random() * 650);
    }

    function start() {
      var ctx = ensure();
      if (!ctx) return;
      if (playing) return;
      playing = true;
      if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }

      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.62, ctx.currentTime + 3.2);

      step = 0;
      tick();
    }

    function stop() {
      if (!playing) return;
      playing = false;
      if (timerId) { clearTimeout(timerId); timerId = null; }

      if (ac && master) {
        master.gain.cancelScheduledValues(ac.currentTime);
        master.gain.setValueAtTime(master.gain.value, ac.currentTime);
        master.gain.linearRampToValueAtTime(0, ac.currentTime + 1.5);
      }
    }

      start: start,
      stop: stop,
      toggle: function () {
        enabled = !enabled;
        if (enabled) start(); else stop();
        return enabled;

      isOn: function () { return enabled; }

    for (var i = 0; i < count; i++) {

  function drawStars() {
    var t = performance.now() / 1000;

      var px = s.x + parallax.x * s.depth * 20;
      var py = s.y + parallax.y * s.depth * 20;

      ctx.globalAlpha = tw;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();

      if (s.r > 1.15) {
        ctx.globalAlpha = tw * 0.22;
        ctx.beginPath();
        ctx.arc(px, py, s.r * 3.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function initMoonParticles() {
    moonParticles = [];
    for (var i = 0; i < 22; i++) {
      moonParticles.push({
        angle: Math.random() * Math.PI * 2,
        radius: rand(72, 150),
        speed: rand(-0.18, 0.18),
        size: rand(0.9, 2.4),
        phase: Math.random() * Math.PI * 2,
        phaseSpeed: rand(0.4, 1.4),
        hue: rand(42, 55)
      });
    }
  }

  function drawMoonParticles() {
    var t = performance.now() / 1000;
    var mx = W / 2;
    var floatY = -4 * (1 - Math.cos(2 * Math.PI * t / 7));
    var my = 86 + floatY;

    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < moonParticles.length; i++) {
      var p = moonParticles[i];
      p.angle += p.speed * 0.016;
      var r = p.radius + Math.sin(t * p.phaseSpeed + p.phase) * 9;
      var x = mx + Math.cos(p.angle) * r;
      var y = my + Math.sin(p.angle) * r * 0.5;
      var alpha = 0.25 + 0.55 * Math.abs(Math.sin(t * 1.2 + p.phase));

      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'hsl(' + p.hue + ', 100%, 72%)';
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  var meteorTimer = 1.2;

  function spawnMeteor() {
    meteors.push({
      x: rand(-60, W * 0.7),
      y: rand(-40, H * 0.32),
      vx: rand(320, 520),
      vy: rand(190, 320),
      life: 1,
      len: rand(80, 170),
      width: rand(1.2, 2.4)
    });
  }

  function updateMeteors(dt) {
    meteorTimer -= dt;
    if (meteorTimer <= 0) {
      meteorTimer = rand(3.5, 9);
      spawnMeteor();
    }

    for (var i = meteors.length - 1; i >= 0; i--) {
      var m = meteors[i];
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.life -= dt * 0.85;

      if (m.life <= 0 || m.x > W + 240 || m.y > H + 240) {
        meteors.splice(i, 1);
        continue;
      }

      var ang = Math.atan2(m.vy, m.vx);
      var tx = m.x - Math.cos(ang) * m.len;
      var ty = m.y - Math.sin(ang) * m.len;

      var grad = ctx.createLinearGradient(tx, ty, m.x, m.y);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(1, 'rgba(255,255,255,' + Math.max(m.life, 0).toFixed(2) + ')');

      ctx.strokeStyle = grad;
      ctx.lineWidth = m.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(m.x, m.y);
      ctx.stroke();
    }
  }

  function makePetal(anywhere) {
    return {
      x: rand(-60, W + 60),
      y: anywhere ? rand(-H, H) : rand(-60, -10),
      size: rand(2.6, 6.2),
      vy: rand(20, 52),
      sway: rand(14, 40),
      swaySpeed: rand(0.5, 1.4),
      phase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: rand(-1.8, 1.8),
      alpha: rand(0.3, 0.8),
      hue: rand(40, 54)
    };
  }

  function initPetals() {
    petals = [];
    var n = Math.min(Math.round(W / 34), 40);
    for (var i = 0; i < n; i++) petals.push(makePetal(true));
  }

  function drawPetals(dt) {
    var t = performance.now() / 1000;
    for (var i = 0; i < petals.length; i++) {
      var p = petals[i];
      p.y += p.vy * dt;
      p.rot += p.rotSpeed * dt;

      if (p.y > H + 40) {
        petals[i] = makePetal(false);
        continue;
      }

      var x = p.x + Math.sin(t * p.swaySpeed + p.phase) * p.sway;

      ctx.save();
      ctx.translate(x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = 'hsl(' + p.hue + ', 90%, 66%)';
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.52, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function initFireflies() {
    fireflies = [];
    var n = Math.min(Math.round(W / 22), 26);
    for (var i = 0; i < n; i++) {
      fireflies.push({
        x: rand(0, W),
        y: rand(0, H * 0.95),
        vx: rand(-12, 12),
        vy: rand(-8, 8),
        phase: Math.random() * Math.PI * 2,
        speed: rand(1, 3),
        size: rand(1.4, 2.8),
        hue: rand(42, 58)
      });
    }
  }

  function drawFireflies(dt) {
    var t = performance.now() / 1000;
    ctx.globalCompositeOperation = 'lighter';

    for (var i = 0; i < fireflies.length; i++) {
      var f = fireflies[i];
      f.x += (f.vx + Math.sin(t * f.speed + f.phase) * 8) * dt;
      f.y += (f.vy + Math.cos(t * f.speed * 0.8 + f.phase) * 6) * dt;

      if (f.x < -20) f.x = W + 20;
      if (f.x > W + 20) f.x = -20;
      if (f.y < -20) f.y = H + 20;
      if (f.y > H + 20) f.y = -20;

      var glow = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.8 + f.phase));

      ctx.globalAlpha = glow * 0.5;
      ctx.fillStyle = 'hsl(' + f.hue + ', 100%, 68%)';
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.size * 3.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = glow;
      ctx.fillStyle = 'hsl(' + f.hue + ', 100%, 90%)';
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function mountainY(x, baseY, amp, freq, phase) {
    return baseY
      + Math.sin(x * freq + phase) * amp
      + Math.sin(x * freq * 2.3 + phase * 1.7) * amp * 0.35
      + Math.sin(x * freq * 4.9 + phase * 0.9) * amp * 0.12;
  }

  function drawMountainRange(baseY, amp, freq, phase, fillColor, ridgeColor) {
    var pts = [];
    var step = 5;
    for (var x = -step; x <= W + step; x += step) {
      pts.push({ x: x, y: mountainY(x, baseY, amp, freq, phase) });
    }

    ctx.fillStyle = fillColor;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, H);
    for (var i = 0; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.lineTo(pts[pts.length - 1].x, H);
    ctx.closePath();
    ctx.fill();

    if (ridgeColor) {
      ctx.strokeStyle = ridgeColor;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (var j = 0; j < pts.length; j++) {
        if (j === 0) ctx.moveTo(pts[j].x, pts[j].y);
        else ctx.lineTo(pts[j].x, pts[j].y);
      }
      ctx.stroke();
    }
  }

  function drawPine(x, baseY, h, color) {
    ctx.fillStyle = color;
    for (var i = 0; i < 3; i++) {
      var layerH = h * 0.55;
      var y0 = baseY - i * h * 0.26;
      var w = h * (0.28 - i * 0.05);
      ctx.beginPath();
      ctx.moveTo(x, y0 - layerH);
      ctx.lineTo(x - w, y0);
      ctx.lineTo(x + w, y0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillRect(x - 1, baseY - 2, 2, 5);
  }

  function initTrees() {
    trees = [];
    var layers = [
      { baseY: H * 0.74, amp: 34, freq: 0.0032, phase: landSeed,
        color: 'rgba(24, 20, 56, 0.72)', hMin: 16, hMax: 26, count: 7 },
      { baseY: H * 0.83, amp: 48, freq: 0.0042, phase: landSeed + 2.1,
        color: 'rgba(14, 12, 38, 0.88)', hMin: 20, hMax: 34, count: 9 },
      { baseY: H * 0.91, amp: 40, freq: 0.0054, phase: landSeed + 4.3,
        color: 'rgba(6, 5, 20, 0.95)', hMin: 24, hMax: 42, count: 11 }
    ];

    for (var l = 0; l < layers.length; l++) {
      var L = layers[l];
      for (var i = 0; i < L.count; i++) {
        var x = (i + 0.5) / L.count * W + rand(-W * 0.04, W * 0.04);
        x = Math.max(W * 0.02, Math.min(W * 0.98, x));
        var y = mountainY(x, L.baseY, L.amp, L.freq, L.phase);
        var h = rand(L.hMin, L.hMax);
        trees.push({ x: x, y: y, h: h, color: L.color });
      }
    }
  }

  function drawTrees() {
    for (var i = 0; i < trees.length; i++) {
      var t = trees[i];
      drawPine(t.x, t.y + 2, t.h, t.color);
    }
  }

  function drawLandscape() {
    var t = performance.now() / 1000;
    var drift = Math.sin(t * 0.06) * 6;

    drawMountainRange(
      H * 0.74 + drift * 0.4, 34, 0.0032, landSeed,
      'rgba(28, 24, 62, 0.42)', 'rgba(120, 110, 190, 0.10)'
    );
    drawMountainRange(
      H * 0.83 + drift * 0.6, 48, 0.0042, landSeed + 2.1,
      'rgba(18, 15, 46, 0.62)', 'rgba(150, 130, 200, 0.13)'
    );

    drawTrees();

    drawMountainRange(
      H * 0.91 + drift * 0.8, 40, 0.0054, landSeed + 4.3,
      'rgba(9, 7, 26, 0.88)', 'rgba(255, 220, 160, 0.16)'
    );

    var lakeTop = H * 0.905;
    var lakeGrad = ctx.createLinearGradient(0, lakeTop, 0, H);
    lakeGrad.addColorStop(0, 'rgba(22, 30, 78, 0.72)');
    lakeGrad.addColorStop(0.35, 'rgba(14, 20, 58, 0.86)');
    lakeGrad.addColorStop(1, 'rgba(6, 10, 30, 0.96)');
    ctx.fillStyle = lakeGrad;
    ctx.fillRect(0, lakeTop, W, H - lakeTop);

    var mx = W / 2;
    var refGrad = ctx.createRadialGradient(mx, lakeTop, 4, mx, lakeTop, Math.min(W * 0.35, 220));
    refGrad.addColorStop(0, 'rgba(255, 240, 200, 0.34)');
    refGrad.addColorStop(0.45, 'rgba(255, 235, 180, 0.11)');
    refGrad.addColorStop(1, 'rgba(255, 230, 170, 0)');
    ctx.fillStyle = refGrad;
    ctx.fillRect(0, lakeTop, W, H - lakeTop);

    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = 'rgba(255, 240, 200, 0.55)';
    ctx.lineWidth = 1;
    for (var i = 0; i < 5; i++) {
      var ry = lakeTop + 12 + i * 11;
      var rw = 50 + Math.sin(t * 1.4 + i) * 22;
      ctx.beginPath();
      ctx.moveTo(mx - rw, ry);
      ctx.lineTo(mx + rw, ry);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  var HUES = [45, 32, 350, 288, 195, 16, 55];
  var FIREWORK_TYPES = ['burst', 'ring', 'heart', 'willow', 'doubleRing', 'chrysanthemum'];

  function pushSpark(x, y, vx, vy, hue, opt) {
    opt = opt || {};
    sparks.push({
      x: x, y: y, vx: vx, vy: vy,
      life: 1,
      decay: opt.decay || rand(0.5, 1.05),
      hue: hue,
      size: opt.size || rand(1.1, 2.9),
      gravity: (opt.gravity == null) ? 120 : opt.gravity
    });
  }

  function explodeBurst(x, y, hue) {
    var count = 64 + Math.floor(Math.random() * 46);
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = rand(50, 260);
      pushSpark(x, y, Math.cos(a) * sp, Math.sin(a) * sp, hue + rand(-22, 22));
    }
  }

  function explodeRing(x, y, hue) {
    var count = 68;
    var sp = rand(150, 220);
    for (var i = 0; i < count; i++) {
      var a = (Math.PI * 2 * i) / count;
      pushSpark(
        x, y,
        Math.cos(a) * sp * rand(0.92, 1.08),
        Math.sin(a) * sp * rand(0.92, 1.08),
        hue + rand(-10, 10),
        { decay: rand(0.45, 0.7), size: rand(1.4, 2.6) }
      );
    }
  }

  function explodeDoubleRing(x, y, hue) {
    var count = 60;
    var r1 = 130, r2 = 220;
    for (var i = 0; i < count; i++) {
      var a = (Math.PI * 2 * i) / count;
      pushSpark(x, y, Math.cos(a) * r1, Math.sin(a) * r1, hue + rand(-8, 8), { decay: rand(0.5, 0.75) });
      pushSpark(x, y, Math.cos(a) * r2, Math.sin(a) * r2, hue + 40 + rand(-10, 10), { decay: rand(0.4, 0.65), size: rand(1.2, 2.2) });
    }
  }

  function explodeHeart(x, y, hue) {
    var count = 90;
    var scale = 11;
    for (var i = 0; i < count; i++) {
      var t = (Math.PI * 2 * i) / count;
      var hx = 16 * Math.pow(Math.sin(t), 3);
      var hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      pushSpark(
        x, y,
        hx * scale * rand(0.92, 1.06),
        hy * scale * rand(0.92, 1.06),
        hue + rand(-14, 14),
        { decay: rand(0.42, 0.68), size: rand(1.5, 2.8), gravity: 90 }
      );
    }
  }

  function explodeWillow(x, y, hue) {
    var count = 46;
    for (var i = 0; i < count; i++) {
      var a = -Math.PI / 2 + rand(-0.9, 0.9);
      var sp = rand(120, 220);
      pushSpark(
        x, y,
        Math.cos(a) * sp, Math.sin(a) * sp,
        hue + rand(-18, 18),
        { decay: rand(0.22, 0.4), size: rand(1.4, 2.4), gravity: 220 }
      );
    }
  }

  function explodeChrysanthemum(x, y, hue) {
    var rays = 20;
    for (var r = 0; r < rays; r++) {
      var a = (Math.PI * 2 * r) / rays + rand(-0.05, 0.05);
      var trail = 5 + Math.floor(Math.random() * 4);
      for (var k = 0; k < trail; k++) {
        var sp = 40 + k * 32 + rand(-8, 8);
        pushSpark(
          x, y,
          Math.cos(a) * sp, Math.sin(a) * sp,
          hue + rand(-14, 14),
          { decay: rand(0.5, 0.85), size: rand(1.1, 2.2) }
        );
      }
    }
  }

  function explode(x, y, hue, type) {
    if (sparks.length > 1700) sparks.splice(0, 520);

    if (!type) type = FIREWORK_TYPES[Math.floor(Math.random() * FIREWORK_TYPES.length)];

    var baseHue = (hue == null)
      ? HUES[Math.floor(Math.random() * HUES.length)] + rand(-12, 12)
      : hue;

    switch (type) {
      case 'ring':          explodeRing(x, y, baseHue); break;
      case 'heart':         explodeHeart(x, y, baseHue); break;
      case 'willow':        explodeWillow(x, y, baseHue); break;
      case 'doubleRing':    explodeDoubleRing(x, y, baseHue); break;
      case 'chrysanthemum': explodeChrysanthemum(x, y, baseHue); break;
      default:              explodeBurst(x, y, baseHue);
    }

    for (var k = 0; k < 10; k++) {
      var a2 = Math.random() * Math.PI * 2;
      var sp2 = rand(10, 85);
      pushSpark(x, y, Math.cos(a2) * sp2, Math.sin(a2) * sp2, baseHue, {
        decay: rand(1.3, 1.9), size: rand(1.8, 3.4), gravity: 30
      });
    }
  }

  function drawSparks(dt) {
    if (!sparks.length) return;

    ctx.globalCompositeOperation = 'lighter';

    for (var i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];

      s.vx *= 0.982;
      s.vy = s.vy * 0.982 + s.gravity * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.life -= s.decay * dt;

      if (s.life <= 0 || s.y > H + 80) {
        sparks.splice(i, 1);
        continue;
      }

      var l = Math.max(s.life, 0);
      ctx.globalAlpha = l;
      ctx.fillStyle = 'hsl(' + s.hue + ', 100%, ' + (58 + l * 22) + '%)';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * l, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  var danmakuTimer = 6;

  function spawnDanmaku() {
    danmakuList.push({
      text: POEM_LINES[Math.floor(Math.random() * POEM_LINES.length)],
      x: W + 30,
      y: rand(H * 0.12, H * 0.68),
      vx: -rand(28, 52),
      alpha: rand(0.22, 0.45),
      size: rand(13, 18)
    });
  }

  function updateDanmaku(dt) {
    danmakuTimer -= dt;
    if (danmakuTimer <= 0) {
      danmakuTimer = rand(9, 18);
      if (danmakuList.length < 5) spawnDanmaku();
    }

    for (var i = danmakuList.length - 1; i >= 0; i--) {
      var d = danmakuList[i];
      d.x += d.vx * dt;
      if (d.x < -320) danmakuList.splice(i, 1);
    }
  }

  function drawDanmaku() {
    if (!danmakuList.length) return;

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    for (var i = 0; i < danmakuList.length; i++) {
      var d = danmakuList[i];
      ctx.globalAlpha = d.alpha;
      ctx.fillStyle = '#ffe08a';
      ctx.font = d.size + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.shadowColor = 'rgba(255, 200, 90, 0.6)';
      ctx.shadowBlur = 9;
      ctx.fillText(d.text, d.x, d.y);
      ctx.shadowBlur = 0;
    }

    ctx.globalAlpha = 1;
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  var autoFireTimer = 5;
  var lastTime = performance.now();
  var showDanmaku = true;

  function loop(now) {
    requestAnimationFrame(loop);

    if (!pageVisible) {
      lastTime = now;
      return;
    }

    var dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    parallax.x += (targetParallax.x - parallax.x) * Math.min(dt * 4, 1);
    parallax.y += (targetParallax.y - parallax.y) * Math.min(dt * 4, 1);

    ctx.clearRect(0, 0, W, H);

    drawStars();
    drawMoonParticles();
    updateMeteors(dt);
    drawPetals(dt);
    drawFireflies(dt);
    drawLandscape();

    if (showDanmaku) {
      updateDanmaku(dt);
      drawDanmaku();
    }

    drawSparks(dt);

    autoFireTimer -= dt;
    if (autoFireTimer <= 0) {
      autoFireTimer = rand(8, 15);
      explode(rand(W * 0.12, W * 0.88), rand(H * 0.1, H * 0.38));
    }
  }

  /* ============================================================
   *  页面可见性
   * ============================================================ */
  document.addEventListener('visibilitychange', function () {
    pageVisible = !document.hidden;
    if (!pageVisible) {
      clearTimeout(rabbitAutoTimer);
    } else {
      scheduleRabbitAutoJump();
    }
  });

  /* ============================================================
   *  飘字 / Toast / 兔兔爱心
   * ============================================================ */
  var floatLayer = document.getElementById('floatLayer');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function addFloatText(x, y, text) {
    var el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    floatLayer.appendChild(el);
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 1700);
  }

  function spawnRabbitEmojis(rect) {
    for (var i = 0; i < 6; i++) {
      (function (idx) {
        setTimeout(function () {
          var el = document.createElement('div');
          el.className = 'rabbit-heart';
          el.textContent = RABBIT_EMOJIS[Math.floor(Math.random() * RABBIT_EMOJIS.length)];
          var x = rect.left + rect.width * rand(0.15, 0.9);
          var y = rect.top + rect.height * rand(0.1, 0.5);
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          floatLayer.appendChild(el);
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 1500);
        }, idx * 80);
      })(i);
    }
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 2000);
  }

  /* ============================================================
   *  首次交互启动背景音乐
   * ============================================================ */
  var musicHint = document.getElementById('musicHint');
  var musicBtn = document.getElementById('musicBtn');
  var musicAutoStarted = false;

  function startMusicOnFirstTouch() {
    if (musicAutoStarted) return;
    musicAutoStarted = true;

    if (!Music.isOn()) {
      Music.toggle();
      musicBtn.classList.add('active');
    }

    musicHint.classList.add('hide');
  }

  window.addEventListener('pointerdown', startMusicOnFirstTouch, { once: true });
  window.addEventListener('keydown', startMusicOnFirstTouch, { once: true });
  setTimeout(function () { musicHint.classList.add('hide'); }, 8000);

  /* ============================================================
   *  玉兔交互
   * ============================================================ */
  var rabbitEl = document.getElementById('rabbitEl');
  var rabbitJumpTimer = null;
  var rabbitAutoTimer = null;
  var rabbitJumping = false;

  function triggerRabbitJump(fromClick) {
    if (!rabbitEl || rabbitJumping) return;

  var cardCanvas = document.getElementById('cardCanvas');

  function wrapText(g, text, cx, y, maxWidth, lineHeight) {
    var chars = text.split('');
    var line = '';
    var lines = [];

    for (var i = 0; i < chars.length; i++) {
      var test = line + chars[i];
      if (g.measureText(test).width > maxWidth && line !== '') {
        lines.push(line);
        line = chars[i];
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);

    var startY = y - ((lines.length - 1) * lineHeight) / 2;
    for (var j = 0; j < lines.length; j++) {
      g.fillText(lines[j], cx, startY + j * lineHeight);
    }
  }

  function drawRabbitOnCard(g, cx, cy, scale) {
    g.save();
    g.translate(cx, cy);
    g.scale(scale, scale);

    var STROKE = '#3d2b56';

    g.fillStyle = '#fffdf8';
    g.strokeStyle = STROKE;
    g.lineWidth = 3;
    g.beginPath();
    g.arc(32, 6, 11, 0, Math.PI * 2);
    g.fill();
    g.stroke();

    g.beginPath();
    g.ellipse(0, 0, 34, 29, 0, 0, Math.PI * 2);
    g.fill();
    g.stroke();

    g.fillStyle = '#ffe9f3';
    g.beginPath();
    g.ellipse(0, 6, 18, 14, 0, 0, Math.PI * 2);
    g.fill();

    function drawEar(dir) {
      g.save();
      g.translate(dir * 13, -40);
      g.rotate(dir * 0.26);

      g.fillStyle = '#fffdf8';
      g.strokeStyle = STROKE;
      g.lineWidth = 3;
      g.beginPath();
      g.ellipse(0, 0, 9, 22, 0, 0, Math.PI * 2);
      g.fill();
      g.stroke();

      g.fillStyle = '#ffb0d3';
      g.beginPath();
      g.ellipse(0, 2, 4.2, 14, 0, 0, Math.PI * 2);
      g.fill();

      g.restore();
    }
    drawEar(-1);
    drawEar(1);

    g.fillStyle = '#fffdf8';
    g.strokeStyle = STROKE;
    g.lineWidth = 3;
    g.beginPath();
    g.ellipse(0, -23, 28, 25, 0, 0, Math.PI * 2);
    g.fill();
    g.stroke();

    g.fillStyle = '#2e2035';
    g.beginPath();
    g.arc(-10, -26, 4.5, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.arc(10, -26, 4.5, 0, Math.PI * 2);
    g.fill();

    g.fillStyle = '#ffffff';
    g.beginPath();
    g.arc(-11.2, -27.2, 1.7, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.arc(8.8, -27.2, 1.7, 0, Math.PI * 2);
    g.fill();

    g.fillStyle = '#ffb0d3';
    g.beginPath();
    g.ellipse(-18, -17, 5.5, 3.5, 0, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.ellipse(18, -17, 5.5, 3.5, 0, 0, Math.PI * 2);
    g.fill();

    g.fillStyle = '#ff7aa8';
    g.beginPath();
    g.ellipse(0, -17.5, 3, 2.4, 0, 0, Math.PI * 2);
    g.fill();

    g.strokeStyle = STROKE;
    g.lineWidth = 1.8;
    g.beginPath();
    g.arc(0, -13, 4.5, 0.2, Math.PI - 0.2);
    g.stroke();

    g.restore();
  }

  function renderCard() {
    var w = cardCanvas.width;
    var h = cardCanvas.height;
    var g = cardCtx;

    g.clearRect(0, 0, w, h);

    var bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#0a0e27');
    bg.addColorStop(0.45, '#161e46');
    bg.addColorStop(0.78, '#1e2555');
    bg.addColorStop(1, '#241a3d');
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);

    for (var i = 0; i < 160; i++) {
      g.globalAlpha = rand(0.15, 0.95);
      g.fillStyle = '#ffffff';
      g.beginPath();
      g.arc(rand(0, w), rand(0, h * 0.72), rand(0.4, 1.9), 0, Math.PI * 2);
      g.fill();
    }
    g.globalAlpha = 1;

    g.fillStyle = 'rgba(12, 10, 32, 0.7)';
    g.beginPath();
    g.moveTo(0, h);
    for (var mx2 = 0; mx2 <= w; mx2 += 8) {
      var my2 = h * 0.82 + Math.sin(mx2 * 0.008 + 1) * 26 + Math.sin(mx2 * 0.02 + 3) * 12;
      g.lineTo(mx2, my2);
    }
    g.lineTo(w, h);
    g.closePath();
    g.fill();

    for (var ti = 0; ti < 10; ti++) {
      var tx = (ti + 0.5) / 10 * w + rand(-10, 10);
      var ty = h * 0.84 + Math.sin(tx * 0.01 + 1) * 18;
      var th = rand(18, 32);
      g.fillStyle = 'rgba(8, 6, 22, 0.85)';
      for (var li = 0; li < 3; li++) {
        var layerH = th * 0.55;
        var y0 = ty - li * th * 0.26;
        var ww = th * (0.28 - li * 0.05);
        g.beginPath();
        g.moveTo(tx, y0 - layerH);
        g.lineTo(tx - ww, y0);
        g.lineTo(tx + ww, y0);
        g.closePath();
        g.fill();
      }
    }

    g.fillStyle = 'rgba(6, 5, 18, 0.9)';
    g.beginPath();
    g.moveTo(0, h);
    for (var nx = 0; nx <= w; nx += 8) {
      var ny = h * 0.9 + Math.sin(nx * 0.011 + 2.4) * 20 + Math.sin(nx * 0.028 + 0.5) * 9;
      g.lineTo(nx, ny);
    }
    g.lineTo(w, h);
    g.closePath();
    g.fill();

    var cxm = w / 2;
    var cym = 250;
    var halo = g.createRadialGradient(cxm, cym, 30, cxm, cym, 250);
    halo.addColorStop(0, 'rgba(255, 240, 190, 0.55)');
    halo.addColorStop(0.4, 'rgba(255, 225, 150, 0.16)');
    halo.addColorStop(1, 'rgba(255, 220, 140, 0)');
    g.fillStyle = halo;
    g.fillRect(0, 0, w, 620);

    var moonGrad = g.createRadialGradient(cxm - 30, cym - 34, 8, cxm, cym, 108);
    moonGrad.addColorStop(0, '#fffef9');
    moonGrad.addColorStop(0.38, '#fff7e0');
    moonGrad.addColorStop(0.75, '#f7e5b6');
    moonGrad.addColorStop(1, '#e5c88a');
    g.fillStyle = moonGrad;
    g.beginPath();
    g.arc(cxm, cym, 108, 0, Math.PI * 2);
    g.fill();

    var craters = [
      { x: -32, y: -36, r: 22 },
      { x: 26, y: 18, r: 15 },
      { x: -6, y: 46, r: 11 },
      { x: 44, y: -30, r: 9 }
    ];
    for (var c = 0; c < craters.length; c++) {
      var cr = craters[c];
      var cg = g.createRadialGradient(
        cxm + cr.x - cr.r * 0.3, cym + cr.y - cr.r * 0.3, cr.r * 0.15,
        cxm + cr.x, cym + cr.y, cr.r
      );
      cg.addColorStop(0, 'rgba(206, 174, 116, 0.34)');
      cg.addColorStop(1, 'rgba(196, 162, 104, 0.10)');
      g.fillStyle = cg;
      g.beginPath();
      g.arc(cxm + cr.x, cym + cr.y, cr.r, 0, Math.PI * 2);
      g.fill();
    }

    drawRabbitOnCard(g, cxm + 96, cym + 92, 1.05);

    for (var p = 0; p < 40; p++) {
      g.save();
      g.translate(rand(0, w), rand(0, h));
      g.rotate(rand(0, Math.PI * 2));
      g.globalAlpha = rand(0.15, 0.5);
      g.fillStyle = 'hsl(' + rand(40, 54) + ', 90%, 68%)';
      g.beginPath();
      g.ellipse(0, 0, rand(2.5, 5.5), rand(1.4, 3), 0, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }
    g.globalAlpha = 1;

    g.textAlign = 'center';
    g.textBaseline = 'middle';

    g.font = 'bold 62px "PingFang SC", "Microsoft YaHei", sans-serif';
    g.fillStyle = '#ffe08a';
    g.shadowColor = 'rgba(255, 200, 90, 0.6)';
    g.shadowBlur = 26;
    g.fillText('中 秋 佳 节', w / 2, 480);
    g.shadowBlur = 0;

    var lineY = 528;
    var lineW = 180;
    var lg = g.createLinearGradient(w / 2 - lineW, 0, w / 2 + lineW, 0);
    lg.addColorStop(0, 'rgba(255, 220, 150, 0)');
    lg.addColorStop(0.5, 'rgba(255, 220, 150, 0.75)');
    lg.addColorStop(1, 'rgba(255, 220, 150, 0)');
    g.strokeStyle = lg;
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(w / 2 - lineW, lineY);
    g.lineTo(w / 2 + lineW, lineY);
    g.stroke();

    g.fillStyle = 'rgba(255, 220, 150, 0.9)';
    g.beginPath();
    g.arc(w / 2, lineY, 4, 0, Math.PI * 2);
    g.fill();

    g.font = '32px "PingFang SC", "Microsoft YaHei", sans-serif';
    g.fillStyle = '#fdf4e0';
    g.shadowColor = 'rgba(255, 220, 150, 0.35)';
    g.shadowBlur = 16;
    wrapText(g, WISHES[wishIndex], w / 2, 615, w - 130, 50);
    g.shadowBlur = 0;

    var now = new Date();
    var dateStr =
      now.getFullYear() + '.' + (now.getMonth() + 1) + '.' + now.getDate() +
      '  农历八月十五';

    g.font = '22px "PingFang SC", "Microsoft YaHei", sans-serif';
    g.fillStyle = 'rgba(255, 233, 184, 0.65)';

    g.fillStyle = 'rgba(255, 233, 184, 0.42)';

    g.lineWidth = 2;
    g.strokeRect(18, 18, w - 36, h - 36);

    g.textAlign = 'start';
    g.textBaseline = 'alphabetic';
  }
